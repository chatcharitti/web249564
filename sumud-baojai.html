<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดเบาใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar + step chips, one form step per screen, separate print-only document */
:root{
  --bg:#E4ECF0; --surface:#F8FAFB; --field:#FFFFFF; --ink:#2B3A52; --muted:#56677E; --line:#C3D0DA;
  --blue:#46659C; --on-blue:#FFFFFF; --blue-soft:#DCE6F3;
  --orange:#D9722D; --orange-ink:#A24E15; --orange-soft:#FBE7D8;
  --green:#2F8A5E; --green-ink:#1F6A45; --green-soft:#DDF0E6;
  --f-display:'Noto Serif Thai','Sarabun','Tahoma',serif;
  --f-body:'IBM Plex Sans Thai','Sarabun','Tahoma',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151E2A; --surface:#1F2A3A; --field:#162030; --ink:#E5ECF5; --muted:#9DAEC4; --line:#34455C;
    --blue:#8CAAE0; --on-blue:#13202F; --blue-soft:#2A3A55;
    --orange:#F29A5E; --orange-ink:#F2A872; --orange-soft:#44301F;
    --green:#6CC79A; --green-ink:#7ED3A8; --green-soft:#21392D;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.75 var(--f-body)}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* toolbar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.brand{margin:0 auto 0 0;font:600 1.3rem/1.2 var(--f-display);color:var(--blue)}
.brand small{display:block;font:400 .75rem/1.3 var(--f-body);color:var(--muted);letter-spacing:.02em}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.prog{display:flex;align-items:center;gap:10px;padding-bottom:8px;font-size:.8125rem;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .3s}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:5px 13px;border-radius:99px;font-size:.875rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chip .n{font-size:.75rem;color:var(--muted)}
.chip[aria-current=step]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-current=step] .n{color:var(--on-blue);opacity:.8}
.chip.has::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--blue);background:transparent;color:var(--blue);font-weight:600;font-size:.9375rem;cursor:pointer;line-height:1.4}
.btn:hover{background:var(--blue-soft)}
.btn.pri{background:var(--blue);color:var(--on-blue)}
.btn.pri:hover{filter:brightness(1.08);background:var(--blue)}
.btn.warn{border-color:var(--orange-ink);color:var(--orange-ink)}
.btn.sm{padding:5px 10px;font-size:.8125rem}
.btn svg{width:17px;height:17px;flex:none}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:transparent}
.fz{display:inline-flex;align-items:center;gap:4px}
.fz .val{min-width:3.4em;text-align:center;font-size:.8125rem;color:var(--muted)}
.fz .btn{padding:5px 9px}
.btn small{font-weight:400;opacity:.85}

/* stage */
main{padding-block:20px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
h2{margin:0 0 4px;font:600 1.5rem/1.4 var(--f-display);text-wrap:balance}
h3.sub{margin:10px 0 0;font:600 1.0625rem/1.5 var(--f-display);color:var(--blue)}
.lead{margin:0 0 20px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.fld{min-width:0;grid-column:1/-1}
.fld.half{grid-column:auto}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.fld.half{grid-column:1/-1}}
label.l,.q{display:block;margin:0 0 4px;font-weight:600;padding:0}
input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:92px;resize:vertical;line-height:1.6}
fieldset{border:0;margin:0;padding:0;min-width:0}
.optrow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 12px;padding:8px 10px;border-radius:8px}
.optrow:has(input:checked){background:var(--blue-soft)}
label.opt{display:flex;gap:10px;align-items:flex-start;flex:1 1 300px;min-width:0;cursor:pointer}
label.opt input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--blue);flex:none}
.inl{flex:1 1 220px;min-width:0}
.rankrow{display:flex;gap:12px;align-items:flex-start;padding:6px 10px;border-radius:8px}
.rankrow select{width:70px;flex:none;padding:6px 8px}
.rankrow .t{flex:1 1 220px;min-width:0;padding-top:5px}
.hint{margin:0;color:var(--muted);font-size:.9rem}
details.know{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 14px}
details.know summary{cursor:pointer;font-weight:600;padding:9px 0;color:var(--blue)}
details.know p{margin:0 0 12px;color:var(--ink)}
.rrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:8px 10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
.rf span{display:block;font-size:.8125rem;color:var(--muted)}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 14px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.docrow span{font-size:.9375rem}
@media (max-width:600px){.docrow{grid-template-columns:1fr}}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px}
.box{border-radius:12px;padding:14px 16px}
.box.priv{background:var(--green-soft);color:var(--ink)}
.box.priv strong{color:var(--green-ink)}
.box.warn{background:var(--orange-soft)}
.box.warn strong{color:var(--orange-ink)}
.box p{margin:0}
.box p+p{margin-top:6px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.howto li{background:var(--bg);border-radius:10px;padding:12px 14px}
.howto b{display:block;font-family:var(--f-display);color:var(--blue)}
.stack{display:grid;gap:18px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px}
.credit img{display:block;width:100%;height:auto;border-radius:10px}
.contact{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.contact img{width:150px;height:150px;border-radius:10px;border:1px solid var(--line);background:#fff}
@media (max-width:520px){.contact{grid-template-columns:1fr;justify-items:start}}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:2px 8px;border-radius:6px}
footer.foot{padding-block:14px 40px;color:var(--muted);font-size:.8125rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9375rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;max-width:min(92vw,440px)}
dialog::backdrop{background:rgba(10,18,30,.55)}
dialog h3{margin:0 0 6px;font:600 1.15rem var(--f-display)}
dialog p{margin:0 0 16px}
.dlgb{display:flex;justify-content:flex-end;gap:10px}
@media (max-width:640px){.top{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* slide deck */
.deck{display:grid;gap:12px}
.deck-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.deck-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.deck-track::-webkit-scrollbar{display:none}
.deck-track:focus-visible{outline-offset:-3px}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;margin:0;aspect-ratio:1489/809;background:#fff}
.slide img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.deck-ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.deck-ctl .mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dots{display:flex;flex-wrap:wrap;justify-content:center}
.dot{width:24px;height:24px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s}
.dot[aria-current=true]::before{background:var(--orange)}
.deck-ctl .btn{white-space:nowrap}
@media (max-width:520px){.deck-ctl{display:grid;grid-template-columns:1fr 1fr}.deck-ctl .mid{grid-column:1/-1;order:-1}}
.cnt{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* print-only document */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 18mm}
  html,body{background:#fff!important;color:#000!important}
  body{font:400 10.5pt/1.55 var(--f-body)}
  html{font-size:100%!important}
  #app,dialog,#toast{display:none!important}
  #print{display:block}
  .phead{border-bottom:.5mm solid #000;padding-bottom:3mm;margin-bottom:5mm}
  .phead h1{margin:0;font:600 22pt/1.2 var(--f-display)}
  .phead p{margin:1mm 0 0;font-size:10pt;color:#333}
  .ps{margin-bottom:6mm}
  .ps h2{margin:0 0 3mm;padding-bottom:1mm;border-bottom:.3mm solid #000;font:600 14pt/1.4 var(--f-display);break-after:avoid}
  .ph{margin:3mm 0 1mm;font:600 11.5pt/1.4 var(--f-display);grid-column:1/-1;break-after:avoid}
  .pbody{display:grid;grid-template-columns:1fr 1fr;gap:0 7mm}
  .pf{grid-column:1/-1;margin:0 0 3mm;break-inside:avoid}
  .pf.half{grid-column:auto}
  .pl{font-size:9.5pt;color:#333}
  .pl.b{font-weight:600;color:#000;margin-bottom:.5mm}
  .pv{min-height:6.5mm;border-bottom:.25mm dotted #555;padding:0 1mm;white-space:pre-wrap;overflow-wrap:anywhere}
  .pv.area{line-height:6.5mm;min-height:13mm;border:0;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 6.1mm,#888 6.1mm,#888 6.5mm);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pv.area.l3{min-height:19.5mm}
  .po{display:flex;gap:2.5mm;align-items:flex-start;margin:0 0 1mm;break-inside:avoid}
  .bx{flex:none;position:relative;width:3.6mm;height:3.6mm;margin-top:1.2mm;border:.35mm solid #000;display:inline-block}
  .bx.on::after{content:"";position:absolute;left:.9mm;top:-.1mm;width:1.3mm;height:2.5mm;border:solid #000;border-width:0 .45mm .45mm 0;transform:rotate(45deg)}
  .rk{flex:none;width:7mm;height:5.5mm;margin-top:.5mm;border:.3mm solid #000;text-align:center;font-weight:600;line-height:5mm;font-size:10pt}
  .pu{display:inline-block;min-width:48mm;border-bottom:.25mm dotted #555;vertical-align:bottom;padding:0 1mm;white-space:pre-wrap}
  table.pt{width:100%;border-collapse:collapse;font-size:10pt;break-inside:avoid}
  table.pt th,table.pt td{border:.25mm solid #555;padding:1.2mm 2mm;text-align:left;vertical-align:top;height:8mm}
  table.pt th{background:#eee;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .psign{margin-top:4mm}
  .sigline{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:10mm}
  .sigline div{border-top:.25mm solid #000;padding-top:1mm;text-align:center}
  .wallet{break-inside:avoid;margin:6mm 0}
  .wcut{font-size:9pt;color:#444;margin-bottom:2mm}
  .wcard{width:86mm;min-height:54mm;border:.35mm dashed #000;border-radius:3mm;padding:3.5mm 4mm;font-size:9.5pt;line-height:1.45}
  .wcard .wt{font:600 13pt/1.2 var(--f-display)}
  .wcard .ws{margin:1.5mm 0 2.5mm}
  .pcredit{break-inside:avoid;margin-top:8mm;border-top:.3mm solid #000;padding-top:4mm;font-size:9.5pt;color:#222}
  .pcredit img{display:block;width:118mm;max-width:100%;height:auto;margin-bottom:3mm}
}
</style>
</head>

<noscript><p style="padding:20px">แอปนี้ต้องเปิดใช้งาน JavaScript เพื่อทำงาน</p></noscript>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <h1 class="brand">สมุดเบาใจ<small>แบบฟอร์มวางแผนการดูแลล่วงหน้า</small></h1>
        <div class="acts">
          <div class="fz" role="group" aria-label="ขนาดตัวอักษร"><button class="btn sm" type="button" id="fsDn" data-act="fs-dn" aria-label="ลดขนาดตัวอักษร" title="ลดขนาดตัวอักษร">A−</button><button class="btn sm" type="button" id="fsVal" data-act="fs-reset" aria-label="คืนค่าขนาดตัวอักษรปกติ" title="คืนค่าขนาดปกติ"><span class="val">100%</span></button><button class="btn sm" type="button" id="fsUp" data-act="fs-up" aria-label="เพิ่มขนาดตัวอักษร" title="เพิ่มขนาดตัวอักษร">A+</button></div>
          <button class="btn sm" type="button" data-act="export" title="Export: บันทึกข้อมูลเป็นไฟล์ในเครื่อง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>บันทึกไฟล์</button>
          <button class="btn sm" type="button" data-act="import" title="Import: เปิดไฟล์ที่เคยบันทึกไว้"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>เปิดไฟล์</button>
          <button class="btn sm pri" type="button" data-act="print" title="พิมพ์ หรือบันทึกเป็น PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>พิมพ์ / PDF</button>
        </div>
      </div>
      <div class="prog"><span id="progTxt">กรอกแล้ว 0%</span><div class="track" role="progressbar" aria-label="ความคืบหน้าการกรอกข้อมูล" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progBar"></i></div></div>
      <nav class="steps" id="steps" aria-label="หมวดของแบบฟอร์ม"></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="card" id="stage" aria-live="polite"></section>
  </main>

  <footer class="wrap foot">
    เครื่องมือช่วยวางแผน ไม่จัดเก็บข้อมูลใดๆ · ปรึกษาประกันชีวิตและประกันสุขภาพ: LINE ID <span class="mono">chatcharitti_mobile</span>
  </footer>
</div>

<div id="print" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgM"></p><div class="dlgb"><button class="btn" id="dlgNo" type="button">ยกเลิก</button><button class="btn pri" id="dlgYes" type="button">ตกลง</button></div></dialog>

const blank=()=>({policies:[{}],contacts:[{}],knowers:[{}],docs:{},values:{}});
let d=blank(), dirty=false, cur=0;

function findOpt(k,v){ for(const s of SCHEMA){ for(const it of (s.items||[])){ if(it.k===k&&it.opts){ const f=it.opts.find(x=>x.v===v); if(f) return f; } } } return null; }

function filled(it){
  const v=d[it.k];
  switch(it.t){
    case "text":case "tel":case "date":case "area": return !!(v&&String(v).trim());
    case "radio": return !!v;
    case "check": return Array.isArray(v)&&v.length>0;
    case "rank": return v&&Object.keys(v).length>0;
    case "rows": return Array.isArray(v)&&v.some(r=>Object.values(r).some(x=>String(x).trim()));
    case "docs": return v&&Object.values(v).some(x=>String(x).trim());
  }
  return false;
}
function stats(){
  let tot=0,f=0; const per=[];
  SCHEMA.forEach((s,i)=>{ let a=0,b=0; (s.items||[]).forEach(it=>{ if(["note","h","know"].includes(it.t)) return; b++; if(filled(it)) a++; }); per[i]={a,b}; tot+=b; f+=a; });
  return {tot,f,per};
}

/* ---------- rendering: form ---------- */
function optRow(it,op,type){
  const on=type==="radio"?d[it.k]===op.v:(d[it.k]||[]).includes(op.v);
  const id=`o_${it.k}_${op.v}`;
  const inl=op.inp?`<input class="inl" type="text" data-inl="${op.inp}" value="${esc(d[op.inp]||"")}" placeholder="${esc(op.ph||"ระบุ")}" aria-label="${esc(op.ph||"ระบุ")}">`:"";
  return `<div class="optrow"><label class="opt" for="${id}"><input id="${id}" type="${type==="radio"?"radio":"checkbox"}" name="${it.k}" data-k="${it.k}" data-v="${op.v}"${on?" checked":""}><span>${esc(op.l)}</span></label>${inl}</div>`;
}
function rowsHTML(it){
  return d[it.k].map((r,i)=>`<div class="rrow">${it.cols.map(c=>`<label class="rf"><span>${esc(c.l)}</span><input type="text" data-rk="${it.k}" data-i="${i}" data-f="${c.f}" value="${esc(r[c.f]||"")}"></label>`).join("")}<button class="btn sm warn" type="button" data-act="rm" data-k="${it.k}" data-i="${i}" aria-label="ลบรายการที่ ${i+1}">ลบ</button></div>`).join("");
}
function itemHTML(it){
  const half=it.half?" half":"";
  switch(it.t){
    case "note": return `<div class="fld"><div class="box warn"><p>${esc(it.x)}</p></div></div>`;
    case "know": return `<div class="fld"><details class="know"><summary>${esc(it.l)}</summary><p>${esc(it.x)}</p></details></div>`;
    case "h": return `<h3 class="sub fld">${esc(it.l)}</h3>`;
    case "text":case "tel":case "date":
      return `<div class="fld${half}"><label class="l" for="f_${it.k}">${esc(it.l)}</label><input id="f_${it.k}" type="${it.t==="text"?"text":it.t}" ${it.im?`inputmode="${it.im}" `:""}data-k="${it.k}" value="${esc(d[it.k]||"")}" autocomplete="off"></div>`;
    case "area":
      return `<div class="fld"><label class="l" for="f_${it.k}">${esc(it.l)}</label>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}<textarea id="f_${it.k}" data-k="${it.k}" rows="${it.rows||3}">${esc(d[it.k]||"")}</textarea></div>`;
    case "radio":case "check":
      return `<fieldset class="fld"><legend class="q">${esc(it.l)}</legend>${it.opts.map(op=>optRow(it,op,it.t)).join("")}</fieldset>`;
    case "rank":
      return `<fieldset class="fld"><legend class="q">${esc(it.l)}</legend><p class="hint">${esc(it.hint||"")}</p>${it.opts.map(op=>{ const n=d[it.k][op.v]||""; const sid=`rk_${op.v}`;
        return `<div class="rankrow"><select id="${sid}" data-rank="${it.k}" data-v="${op.v}" aria-label="ลำดับของ ${esc(op.l)}"><option value="">–</option>${[1,2,3].map(x=>`<option value="${x}"${n==x?" selected":""}>${x}</option>`).join("")}</select><label class="t" for="${sid}">${esc(op.l)}</label>${op.inp?`<input class="inl" type="text" data-inl="${op.inp}" value="${esc(d[op.inp]||"")}" placeholder="ระบุ" aria-label="ระบุ">`:""}</div>`; }).join("")}</fieldset>`;
    case "rows":
      return `<div class="fld"><div id="rows_${it.k}">${rowsHTML(it)}</div><button class="btn sm" type="button" data-act="add" data-k="${it.k}">+ ${esc(it.add)}</button></div>`;
    case "docs":
      return `<div class="fld"><p class="q">${esc(it.l)}</p>${it.items.map(x=>`<div class="docrow"><label for="dc_${x[0]}"><span>${esc(x[1])}</span></label><input id="dc_${x[0]}" type="text" data-doc="${x[0]}" value="${esc(d.docs[x[0]]||"")}" placeholder="เก็บไว้ที่..."></div>`).join("")}</div>`;
  }
  return "";
}

/* slide deck behaviour */
let deckIdx=0;
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function deckTo(i,smooth){
  const tr=$("#deck"); if(!tr) return;
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  tr.scrollTo({left:i*tr.clientWidth,behavior:smooth&&!reduceMotion()?"smooth":"auto"});
  deckIdx=i; deckUI();
}
function deckUI(){
  const n=SLIDES.length; if(!$("#deck")) return;
  $("#dkCnt").textContent=`${deckIdx+1} / ${n}`;
  $("#dkPrev").disabled=deckIdx===0; $("#dkNext").disabled=deckIdx===n-1;
  document.querySelectorAll(".dot").forEach((d,i)=>d.setAttribute("aria-current",i===deckIdx?"true":"false"));
  const g=$("#dkGo"), last=deckIdx===n-1;
  g.textContent=last?"เริ่มกรอกข้อมูล →":"ข้ามไปกรอกข้อมูล →"; g.classList.toggle("pri",last);
}
function initDeck(){
  const tr=$("#deck"); if(!tr) return;
  let raf=0;
  tr.addEventListener("scroll",()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{
    const i=Math.max(0,Math.min(SLIDES.length-1,Math.round(tr.scrollLeft/(tr.clientWidth||1))));
    if(i!==deckIdx){ deckIdx=i; deckUI(); } }); },{passive:true});
  tr.addEventListener("keydown",e=>{
    const k=e.key; if(k==="ArrowRight"){ deckTo(deckIdx+1,true); e.preventDefault(); }
    else if(k==="ArrowLeft"){ deckTo(deckIdx-1,true); e.preventDefault(); }
    else if(k==="Home"){ deckTo(0,true); e.preventDefault(); }
    else if(k==="End"){ deckTo(SLIDES.length-1,true); e.preventDefault(); }
  });
  deckTo(deckIdx,false);
}
window.addEventListener("resize",()=>{ if($("#deck")) deckTo(deckIdx,false); });

function renderStep(i){
  cur=i; const s=SCHEMA[i]; let h="";
  if(i===0) h=startHTML();
  else{
    h=`<h2>${i} · ${esc(s.title)}</h2><p class="lead">${esc(s.lead||"")}</p><div class="fgrid">${s.items.map(itemHTML).join("")}</div>`;
    if(i===SCHEMA.length-1) h+=finishExtra();
    const prev=i>0?`<button class="btn" type="button" data-go="${i-1}">← ${i-1===0?"หน้าเริ่มต้น":esc(SCHEMA[i-1].title)}</button>`:"<span></span>";
    const next=i<SCHEMA.length-1?`<button class="btn pri" type="button" data-go="${i+1}">${esc(SCHEMA[i+1].title)} →</button>`:"";
    h+=`<div class="pager">${prev}${next}</div>`;
  }
  $("#stage").innerHTML=h;
  if(i===0) initDeck();
  renderNav(); window.scrollTo({top:0});
  const c=document.querySelector(".chip[aria-current=step]"); if(c&&c.scrollIntoView) c.scrollIntoView({inline:"center",block:"nearest"});
}
function renderNav(){
  const st=stats();
  $("#steps").innerHTML=SCHEMA.map((s,i)=>`<button type="button" class="chip${st.per[i].a>0?" has":""}" data-go="${i}"${i===cur?' aria-current="step"':""}>${i>0?`<span class="n">${i}</span>`:""}${esc(s.title)}</button>`).join("");
  updateProgress(st);
}
function updateProgress(st){
  st=st||stats(); const p=st.tot?Math.round(st.f*100/st.tot):0;
  $("#progBar").style.width=p+"%"; $("#progTxt").textContent=`กรอกแล้ว ${p}%`;
  $(".track").setAttribute("aria-valuenow",p);
}
function touch(){ dirty=true; const st=stats(); updateProgress(st); document.querySelectorAll(".chip").forEach((c,i)=>c.classList.toggle("has",st.per[i].a>0)); }

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.inl){
    d[t.dataset.inl]=t.value;
    const row=t.closest(".optrow"); const c=row&&row.querySelector("input[data-k]");
    if(c&&t.value&&!c.checked){ c.checked=true; c.dispatchEvent(new Event("change",{bubbles:true})); }
    touch();
  } else if(t.dataset.rk){ d[t.dataset.rk][+t.dataset.i][t.dataset.f]=t.value; touch(); }
  else if(t.dataset.doc){ d.docs[t.dataset.doc]=t.value; touch(); }
  else if(t.dataset.k&&(t.tagName==="TEXTAREA"||["text","tel","date","number"].includes(t.type))){ d[t.dataset.k]=t.value; touch(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("input[type=radio][data-k]")){ d[t.dataset.k]=t.dataset.v; touch(); }
  else if(t.matches("input[type=checkbox][data-k]")){
    const k=t.dataset.k,v=t.dataset.v; let a=(d[k]||[]).filter(x=>x!==v);
    if(t.checked){ a.push(v); const op=findOpt(k,v); if(op&&op.xor){ a=a.filter(x=>x!==op.xor); const x=document.getElementById(`o_${k}_${op.xor}`); if(x) x.checked=false; } }
    d[k]=a; touch();
  } else if(t.matches("select[data-rank]")){
    const k=t.dataset.rank,v=t.dataset.v,n=t.value;
    if(n){ for(const key of Object.keys(d[k])){ if(key!==v&&String(d[k][key])===n){ delete d[k][key]; const s=document.getElementById("rk_"+key); if(s) s.value=""; } } d[k][v]=+n; }
    else delete d[k][v];
    touch();
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-go]"); if(!b) return;
  if(b.dataset.go!==undefined){ renderStep(+b.dataset.go); return; }
  const a=b.dataset.act;
  if(a==="export") exportData();
  else if(a==="import") $("#imp").click();
  else if(a==="print") doPrint();
  else if(a==="clear") clearAll();
  else if(a==="copy") copyId();
  else if(a==="deck-prev") deckTo(deckIdx-1,true);
  else if(a==="deck-next") deckTo(deckIdx+1,true);
  else if(a==="deck-dot") deckTo(+b.dataset.i,true);
  else if(a==="fs-dn") setFs(fsi-1);
  else if(a==="fs-up") setFs(fsi+1);
  else if(a==="fs-reset") setFs(1);
  else if(a==="add"){ const it=itemByKey(b.dataset.k); d[it.k].push({}); $("#rows_"+it.k).innerHTML=rowsHTML(it); const f=$("#rows_"+it.k).querySelectorAll(".rrow"); const last=f[f.length-1]; if(last) last.querySelector("input").focus(); touch(); }
  else if(a==="rm"){ const it=itemByKey(b.dataset.k); d[it.k].splice(+b.dataset.i,1); if(!d[it.k].length) d[it.k].push({}); $("#rows_"+it.k).innerHTML=rowsHTML(it); touch(); }
});
function itemByKey(k){ for(const s of SCHEMA) for(const it of (s.items||[])) if(it.k===k) return it; return null; }

/* ---------- font size (whole page, kept in memory only) ---------- */
const FS=[85,100,115,130,150]; let fsi=1;
function setFs(i){
  fsi=Math.max(0,Math.min(FS.length-1,i));
  document.documentElement.style.fontSize=FS[fsi]+"%";
  $("#fsVal .val").textContent=FS[fsi]+"%";
  $("#fsDn").disabled=fsi===0; $("#fsUp").disabled=fsi===FS.length-1;
}

/* ---------- toast & dialog ---------- */
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),4200); }
function ask(title,msg,ok){
  const dlg=$("#dlg");
  if(!dlg.showModal) return Promise.resolve(window.confirm(msg));
  return new Promise(res=>{
    $("#dlgT").textContent=title; $("#dlgM").textContent=msg; $("#dlgYes").textContent=ok||"ตกลง";
    const done=v=>{ dlg.close(); res(v); };
    $("#dlgYes").onclick=()=>done(true); $("#dlgNo").onclick=()=>done(false); dlg.oncancel=()=>res(false);
    dlg.showModal();
  });
}

/* ---------- export / import ---------- */
function stamp(){ const n=new Date(),p=x=>String(x).padStart(2,"0"); return `${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}`; }
function baseName(){ const nm=(d.name||"").trim().replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,40)||"ไม่ระบุชื่อ"; return `สมุดเบาใจ_${nm}_${stamp()}`; }
function exportData(){
  const payload={app:"sumud-baojai",version:1,exportedAt:new Date().toISOString(),data:d};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=baseName()+".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  dirty=false; toast("บันทึกไฟล์แล้ว กรุณาเก็บไว้ในที่ปลอดภัย เพราะมีข้อมูลส่วนบุคคลของท่าน");
}
function sanitize(raw){
  const b=blank();
  for(const k of Object.keys(raw)){
    if(SK.includes(k)) continue; const v=raw[k];
    if(typeof v==="string") b[k]=v.slice(0,5000);
    else if(Array.isArray(v)) b[k]=v.slice(0,50).map(x=>x&&typeof x==="object"?Object.fromEntries(Object.entries(x).filter(p=>!SK.includes(p[0])).map(p=>[p[0],String(p[1]).slice(0,1000)])):String(x).slice(0,200));
    else if(v&&typeof v==="object") b[k]=Object.fromEntries(Object.entries(v).filter(p=>!SK.includes(p[0])).map(p=>[p[0],typeof p[1]==="number"?p[1]:String(p[1]).slice(0,1000)]));
  }
  ["policies","contacts","knowers"].forEach(k=>{ if(!Array.isArray(b[k])||!b[k].length) b[k]=[{}]; });
  if(Array.isArray(b.docs)||typeof b.docs!=="object") b.docs={};
  if(Array.isArray(b.values)||typeof b.values!=="object") b.values={};
  return b;
}
$("#imp").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const txt=await f.text(); const o=JSON.parse(txt);
    if(!o||o.app!=="sumud-baojai"||!o.data||typeof o.data!=="object") throw new Error("format");
    if(dirty){ const ok=await ask("เปิดไฟล์ใหม่","ข้อมูลที่กรอกอยู่ในหน้านี้และยังไม่ได้บันทึก จะถูกแทนที่ด้วยข้อมูลจากไฟล์ ต้องการดำเนินการต่อหรือไม่","เปิดไฟล์"); if(!ok) return; }
    d=sanitize(o.data); dirty=false; renderStep(cur===0?1:cur); toast("เปิดไฟล์สำเร็จ ท่านสามารถกรอกต่อได้ทันที");
  }catch(err){ toast("ไม่สามารถเปิดไฟล์นี้ได้ กรุณาเลือกไฟล์ .json ที่บันทึกจากสมุดเบาใจ"); }
});
async function clearAll(){
  const ok=await ask("ล้างข้อมูลทั้งหมด","ข้อมูลที่กรอกในหน้านี้จะถูกลบทั้งหมดและไม่สามารถกู้คืนได้ หากต้องการเก็บไว้ กรุณาบันทึกไฟล์ก่อน","ล้างข้อมูล");
  if(!ok) return; d=blank(); dirty=false; renderStep(1); toast("ล้างข้อมูลแล้ว");
}
async function copyId(){
  try{ await navigator.clipboard.writeText(LINE_ID); toast("คัดลอก LINE ID แล้ว"); }
  catch(e){ const r=document.createRange(); r.selectNodeContents($("#lineId")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("เลือกข้อความแล้ว กรุณาคัดลอกด้วยตนเอง"); }
}
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ---------- print document ---------- */
function pItem(it){
  const half=it.half?" half":"";
  switch(it.t){
    case "text":case "tel": return `<div class="pf${half}"><div class="pl">${esc(it.l)}</div><div class="pv">${esc(d[it.k]||"")}</div></div>`;
    case "date": return `<div class="pf${half}"><div class="pl">${esc(it.l)}</div><div class="pv">${esc(fmtDate(d[it.k]))}</div></div>`;
    case "area": return `<div class="pf"><div class="pl">${esc(it.l)}${it.hint?` (${esc(it.hint)})`:""}</div><div class="pv area${(it.rows||3)>=3?" l3":""}">${esc(d[it.k]||"")}</div></div>`;
    case "h": return `<div class="ph">${esc(it.l)}</div>`;
    case "radio":case "check":
      return `<div class="pf"><div class="pl b">${esc(it.l)}</div>${it.opts.map(op=>{ const on=it.t==="radio"?d[it.k]===op.v:(d[it.k]||[]).includes(op.v);
        return `<div class="po"><span class="bx${on?" on":""}"></span><span>${esc(op.l)}${op.inp?` <span class="pu">${esc(d[op.inp]||"")}</span>`:""}</span></div>`; }).join("")}</div>`;
    case "rank":
      return `<div class="pf"><div class="pl b">${esc(it.l)} (ลำดับ 1–3)</div>${it.opts.map(op=>`<div class="po"><span class="rk">${esc(d[it.k][op.v]||"")}</span><span>${esc(op.l)}${op.inp?` <span class="pu">${esc(d[op.inp]||"")}</span>`:""}</span></div>`).join("")}</div>`;
    case "rows":{
      const rows=d[it.k].filter(r=>Object.values(r).some(x=>String(x).trim())); while(rows.length<3) rows.push({});
      return `<div class="pf"><div class="pl b">${esc(it.l)}</div><table class="pt"><thead><tr>${it.cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}${it.sig?"<th>ลายเซ็น</th>":""}</tr></thead><tbody>${rows.map(r=>`<tr>${it.cols.map(c=>`<td>${esc(r[c.f]||"")}</td>`).join("")}${it.sig?"<td></td>":""}</tr>`).join("")}</tbody></table></div>`; }
    case "docs":
      return `<div class="pf"><div class="pl b">${esc(it.l)}</div><table class="pt"><thead><tr><th>เอกสาร</th><th>เก็บไว้ที่</th></tr></thead><tbody>${it.items.map(x=>`<tr><td>${esc(x[1])}</td><td>${esc(d.docs[x[0]]||"")}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function buildPrint(){
  const today=new Date().toLocaleDateString("th-TH-u-ca-buddhist",{day:"numeric",month:"long",year:"numeric"});
  let h=`<div class="phead"><h1>สมุดเบาใจ</h1><p>แบบฟอร์มวางแผนการดูแลล่วงหน้า (Advance Care Planning) · ผู้จัดทำเอกสาร: ${esc(d.name||"................................................")} · พิมพ์เมื่อ ${esc(today)}</p></div>`;
  SCHEMA.slice(1).forEach((s,i)=>{
    h+=`<section class="ps"><h2>${i+1}. ${esc(s.ptitle||s.title)}</h2><div class="pbody">${s.items.map(pItem).join("")}`;
    if(s.print==="sign") h+=`<div class="pf psign"><p>ฉันขอรับรองว่า ขณะทำเอกสารฉบับนี้ ฉันมีสติสัมปชัญญะสมบูรณ์</p><div class="sigline"><div>ลงชื่อ ${esc(d.name||"")}<br>ผู้ทำเอกสาร</div><div>ผู้ตัดสินใจแทน ${esc(d.proxy||"")}<br>ผู้รับทราบ</div></div></div>`;
    h+=`</div></section>`;
  });
  h+=`<div class="wallet"><div class="wcut">บัตรพกพา — ตัดตามเส้นประ แล้วเก็บไว้ในกระเป๋าสตางค์</div><div class="wcard"><div class="wt">สมุดเบาใจ</div><div class="ws">ฉันมี Advance Directive<br>หนังสือแสดงเจตนาเลือกวิธีการรักษาในช่วงสุดท้ายของชีวิต</div><div>ชื่อ: ${esc(d.name||"........................................")}</div><div>ผู้ตัดสินใจแทนฉัน: ${esc(d.proxy||"........................")}</div><div>โทร: ${esc(d.proxyTel||"........................")}</div></div></div>`;
  h+=`<div class="pcredit"><img src="${CREDIT_SRC}" alt=""><div><strong>ขอขอบคุณ</strong> โครงการชุมชนกรุณาเพื่อการอยู่และตายดี กลุ่ม Peaceful Death, มูลนิธิสถาบันวิจัยและพัฒนาชุมชนกรุณา และสำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.) ผู้จัดทำและเผยแพร่ “สมุดเบาใจ” ซึ่งเป็นต้นแบบของแนวคิดและเนื้อหาในเอกสารนี้ เอกสารนี้จัดทำจากเครื่องมือกรอกข้อมูลตามหัวข้อของสมุดเบาใจ ไม่ใช่ผลงานอย่างเป็นทางการของหน่วยงานดังกล่าว</div></div>`;
  $("#print").innerHTML=h;
}
let oldTitle=document.title;
function doPrint(){ buildPrint(); oldTitle=document.title; document.title=baseName(); setTimeout(()=>window.print(),50); }
window.addEventListener("beforeprint",()=>{ buildPrint(); if(document.title!==baseName()){ oldTitle=document.title; document.title=baseName(); } });
window.addEventListener("afterprint",()=>{ document.title="สมุดเบาใจ"; });

renderStep(0);
</script>
